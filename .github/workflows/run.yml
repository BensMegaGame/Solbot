name: paper-bots
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: bots
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python bot_a.py
      - run: python bot_b.py
        env: { COINGECKO_KEY: "${{ secrets.COINGECKO_KEY }}" }
      - name: Ergebnisse speichern
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data && git diff --cached --quiet || git commit -m "paper run $(date -u +%FT%TZ)"
          git pull --rebase && git push
