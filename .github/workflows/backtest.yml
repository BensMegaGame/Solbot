name: backtest-bot-b
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: bots
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python backtest_b.py
        env: { COINGECKO_KEY: "${{ secrets.COINGECKO_KEY }}" }
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data && git diff --cached --quiet || git commit -m "backtest B $(date -u +%FT%TZ)"
          git pull --rebase && git push
